[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "datathon-7mlet-lastech"
version = "0.1.0"
description = "Plataforma de experimentação adaptativa com Multi-Armed Bandit para ofertas financeiras"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "xgboost>=2.0",
    "mabwiser>=2.7",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
    "notebook>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
